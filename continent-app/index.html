<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viantra</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The bar matches the opening screen's deep umber (--umber-800) while
         it shows; src/lib/bootSplash.js puts back data-app (the stone ground,
         --neutral-50) when it lifts or when the page opens without it. -->
    <meta name="theme-color" content="#5a3716" data-app="#eef0ea" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Viantra" />
    <!-- Launch screens for the installed app on an iPhone (ROADMAP I7): the
         mark on the stone ground instead of a blank white start. Made by
         scripts/make_splash.mjs, which prints these tags. -->
    <link rel="apple-touch-startup-image" href="/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <meta name="description" content="Stop stitching trips together from five apps. Viantra plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <link rel="canonical" href="https://www.carta-europetravel.com/" />
    <!-- Social / link-preview cards. Static for the shell; scripts/prerender.mjs
         overwrites these per page once the static HTML emitter lands, and
         src/lib/head.js keeps them in step with client-side navigation.
         og:image is the 1200x630 site card from scripts/og (public/og/site.png);
         a page with its own record gets its own card from the same generator. -->
    <meta property="og:site_name" content="Viantra" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.carta-europetravel.com/" />
    <meta property="og:title" content="Plan the whole trip in one place, with what each day costs | Viantra" />
    <meta property="og:description" content="Stop stitching trips together from five apps. Viantra plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <meta property="og:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Viantra receipt: the bed, the food and the total for one person for one day in a European town." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plan the whole trip in one place, with what each day costs | Viantra" />
    <meta name="twitter:description" content="Stop stitching trips together from five apps. Viantra plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <meta name="twitter:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta name="twitter:image:alt" content="A Viantra receipt: the bed, the food and the total for one person for one day in a European town." />
    <!-- The boot index gates the country files and so first render; preloading
         lets it download with the HTML instead of waiting for the JS bundle to
         boot. The country files it names are fetched by src/lib/appData.js. -->
    <link rel="preload" href="/boot.json" as="fetch" crossorigin="anonymous" />
    <!-- Fonts are self-hosted (T199; house style 2026-11, G1). Overpass
         carries every word and figure (--ui, --display, --mono in
         01-tokens.css), figures set tabular; Sofia Sans Extra Condensed sets
         plate names only. Variable woff2, latin and latin-ext, in
         src/assets/fonts so Vite hashes them and rewrites this href. Nothing
         loads from Google's font hosts. The Overpass latin file is preloaded
         because every first paint uses it. The @font-face rules are in
         src/styles/00-fonts.css (T1090): no inline style, for the CSP. -->
    <link rel="preload" href="/src/assets/fonts/Overpass-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- The opening screen (G5, HANDBOOK "Opening screen"). Static, so it
         paints in the first frame; styled by src/styles/06-boot-splash.css
         (no inline style, for the CSP) and run by src/lib/bootSplash.js. It
         stays a sibling after #root: the prerender splices a page into the
         empty root (src/lib/prerenderShell.js), and the CSS hides the splash
         while that page is showing. -->
    <div id="boot-splash" class="boot-splash" aria-busy="true">
      <div class="boot-relief" aria-hidden="true"></div>
      <div class="boot-stack">
        <span class="boot-blaze" aria-hidden="true"><i class="boot-paint"></i><i class="boot-heel"></i></span>
        <div class="boot-name"><span class="sr-only">Viantra</span><span class="boot-letters" aria-hidden="true"><span>C</span><span>a</span><span>r</span><span>t</span><span>a</span></span></div>
        <div class="boot-tag" data-boot="tagline"></div>
        <span class="hs-wait" aria-hidden="true"><span class="hs-blaze blaze-sm"></span><span class="hs-blaze blaze-sm"></span><span class="hs-blaze blaze-sm"></span></span>
        <div class="boot-slow" role="status" data-boot="slow"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
