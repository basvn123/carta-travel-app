<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>What a day in Europe costs, place by place | Carta</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f6f0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Carta" />
    <meta name="description" content="Carta prices the bed, food and local transport per person per day in every place it covers across Europe, and says where each figure came from." />
    <link rel="canonical" href="https://www.carta-europetravel.com/" />
    <!-- Social / link-preview cards. Static for the shell; scripts/prerender.mjs
         overwrites these per page once the static HTML emitter lands, and
         src/lib/head.js keeps them in step with client-side navigation.
         og:image is the 1200x630 site card from scripts/og (public/og/site.png);
         a page with its own record gets its own card from the same generator. -->
    <meta property="og:site_name" content="Carta" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.carta-europetravel.com/" />
    <meta property="og:title" content="What a day in Europe costs, place by place | Carta" />
    <meta property="og:description" content="Carta prices the bed, food and local transport per person per day in every place it covers across Europe, and says where each figure came from." />
    <meta property="og:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Carta receipt: the bed, the food and the total for one person for one day in a European town." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What a day in Europe costs, place by place | Carta" />
    <meta name="twitter:description" content="Carta prices the bed, food and local transport per person per day in every place it covers across Europe, and says where each figure came from." />
    <meta name="twitter:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta name="twitter:image:alt" content="A Carta receipt: the bed, the food and the total for one person for one day in a European town." />
    <!-- The boot index gates the country files and so first render; preloading
         lets it download with the HTML instead of waiting for the JS bundle to
         boot. The country files it names are fetched by src/lib/appData.js. -->
    <link rel="preload" href="/boot.json" as="fetch" crossorigin="anonymous" />
    <!-- Fonts are self-hosted (T199): the three tokens in styles.css (--display, --ui, --mono)
         resolve to the variable woff2 files in public/fonts, latin and latin-ext only.
         Nothing loads from Google's font hosts. The two latin files
         below are preloaded because every first paint uses them. -->
    <link rel="preload" href="/fonts/PlusJakartaSans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Fraunces latin-ext */
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/Fraunces-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Fraunces latin */
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(/fonts/Fraunces-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* JetBrains Mono latin-ext */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url(/fonts/JetBrainsMono-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* JetBrains Mono latin */
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url(/fonts/JetBrainsMono-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Plus Jakarta Sans latin-ext */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/PlusJakartaSans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Plus Jakarta Sans latin */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/PlusJakartaSans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
