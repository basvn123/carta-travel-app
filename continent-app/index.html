<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Carta</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Carta" />
    <meta name="description" content="Stop stitching trips together from five apps. Carta plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <link rel="canonical" href="https://www.carta-europetravel.com/" />
    <!-- Social / link-preview cards. Static for the shell; scripts/prerender.mjs
         overwrites these per page once the static HTML emitter lands, and
         src/lib/head.js keeps them in step with client-side navigation.
         og:image is the 1200x630 site card from scripts/og (public/og/site.png);
         a page with its own record gets its own card from the same generator. -->
    <meta property="og:site_name" content="Carta" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.carta-europetravel.com/" />
    <meta property="og:title" content="Plan the whole trip in one place, with what each day costs | Carta" />
    <meta property="og:description" content="Stop stitching trips together from five apps. Carta plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <meta property="og:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Carta receipt: the bed, the food and the total for one person for one day in a European town." />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plan the whole trip in one place, with what each day costs | Carta" />
    <meta name="twitter:description" content="Stop stitching trips together from five apps. Carta plans the whole trip in one place, with what each day costs, in every place it covers across Europe." />
    <meta name="twitter:image" content="https://www.carta-europetravel.com/og/site.png" />
    <meta name="twitter:image:alt" content="A Carta receipt: the bed, the food and the total for one person for one day in a European town." />
    <!-- The boot index gates the country files and so first render; preloading
         lets it download with the HTML instead of waiting for the JS bundle to
         boot. The country files it names are fetched by src/lib/appData.js. -->
    <link rel="preload" href="/boot.json" as="fetch" crossorigin="anonymous" />
    <!-- Fonts are self-hosted (T199). Since T421 (Lagoon) one family, Figtree,
         carries every role (--ui, --display, --mono all resolve to it in
         01-tokens.css), figures set tabular. Variable woff2, latin and latin-ext
         only; nothing loads from Google's font hosts. The latin file is
         preloaded because every first paint uses it. The @font-face rules are
         in src/styles/00-fonts.css (T1090): no inline style, for the CSP. -->
    <link rel="preload" href="/fonts/Figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
