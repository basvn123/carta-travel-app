# flight-sweep: the twice-daily flight price sweep (T514). See src/index.mjs.
#
# Deploy from continent-app/:
#   npx wrangler d1 create carta_flights           (once; paste the id below)
#   npx wrangler d1 execute carta_flights --remote --file workers/flight-sweep/schema.sql
#   npx wrangler deploy -c workers/flight-sweep/wrangler.toml
# Needs Workers Paid (a search costs 10 to 25 ms of CPU, the free plan allows 10).

name = "flight-sweep"
main = "src/index.mjs"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# Every minute: that minute's share of searches. At :07: publish to R2.
crons = ["* * * * *", "7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "carta_flights"
database_id = "96e6ba1d-68de-4aab-9455-07bdda7cfb95"

# The app's data bucket, read through data.carta-europetravel.com/data/.
[[r2_buckets]]
binding = "DATA"
bucket_name = "carta"

[observability]
enabled = true
