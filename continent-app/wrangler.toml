# Cloudflare Pages project configuration for the Carta app shell.
#
# Pages needs very little from this file: the project name, the directory to
# upload, and the compatibility date. The routing and caching rules live in
# public/_headers and public/_redirects, which Vite copies into dist/ verbatim
# on every build, so they ship with the deploy rather than living in a dashboard
# where they cannot be reviewed or reverted.
#
# The app talks to Supabase over HTTPS from the browser and reads its data
# shards from R2 over a public custom domain (data.carta-europetravel.com).
# Neither needs a binding. The one binding below is for the one Pages Function,
# functions/[[path]].js (T221), which serves the prerendered pages. Only the
# paths in public/_routes.json reach it; everything else stays pure static
# serving, as before.
#
# See Execution/P1/T024-cloudflare-pages-migration.md for the cut-over runbook,
# including the DNS steps, which cannot be done from this file.

name = "carta-app"
compatibility_date = "2026-09-23"
pages_build_output_dir = "dist"

# The prerendered pages and their share cards (T221, owner decision T272).
# A bucket of its own, with no custom domain and no public access, so the same
# HTML is never reachable on a second host (a duplicate for every page) and the
# data bucket's lifecycle and CORS rules never touch it. Filled by
# scripts/prerender/push.mjs; create it once before the first deploy that
# carries this file:
#   npx wrangler r2 bucket create carta-prerender
[[r2_buckets]]
binding = "PRERENDER"
bucket_name = "carta-prerender"

# Build settings, for reference when configuring the Pages project. Pages runs
# these from its own dashboard or from `wrangler pages deploy`; they are recorded
# here so the values are in version control.
#
#   Build command:        npm run build
#   Build output:         dist
#   Root directory:       continent-app
#   Node version:         set NODE_VERSION to match .nvmrc / local node
#
# `npm run build` runs `prebuild`, which is scripts/sync-data.mjs. That script
# reads from app_data/ at the REPO ROOT, one level above this directory. A Pages
# build with its root set to continent-app therefore has to have the repo root
# checked out too, which it does for a normal git integration. Worth knowing
# before debugging an empty wire on the first build.
