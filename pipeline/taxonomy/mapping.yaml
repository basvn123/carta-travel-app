# Mapping from every tag Carta uses today to the Carta travel taxonomy (T1149, ROADMAP F1).
#
# One block per source vocabulary. `pipeline/taxonomy/tag_sources.py` reads each
# source live from the code or the shipped data, and tests/test_taxonomy.py
# fails when a value has no row here, or a row names a node that does not
# exist. A row is either:
#   value: [node ids]   the taxonomy nodes the old tag means (one or more)
#   value: []           and the value is listed under `not_a_concept` with a
#                       reason: a region name, a size class or a ranking word
#                       that the taxonomy deliberately does not hold.
# The mapping is a translation table for T1150, not a tagging: an old
# tag is weak evidence, never the final tag.
schema: carta-taxonomy-mapping/1
taxonomy_version: 1.0.0

