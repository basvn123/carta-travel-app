# Carta travel taxonomy (T1149, ROADMAP F1 part 1). Hand-edited from here on.
#
# What it is: the one vocabulary for what a place, trail, beach, lake or
# mountain offers, in five facets (activity, setting, vibe, traveller,
# practical) and three levels below the facet root. It replaces, after S66
# (T1150) tags the catalogue, the hand-built gem categories, the 20 vibe
# scores and the 12 taste keys; pipeline/taxonomy/mapping.yaml translates
# every tag in use today.
#
# Node fields (modelled on ESCO and SKOS, see docs/ai/taxonomy.md):
#   id                    stable code `<facet prefix>.<slug>`; never reused, never renamed (deprecate instead)
#   facet, level          facet root id; 0 for a root, 1 a group, 2 a tag, 3 a narrower tag
#   parent, children      the broader node and the narrower nodes (children are kept in step by the test)
#   label                 the preferred label in en, de, fr, es, it, nl; null where the app has no label yet
#   label_source          where the six labels come from (an app i18n key, guided.json, or authored English)
#   definition            one sentence: what the tag means (the labeller and the tagger read this)
#   synonyms              alternative labels, English for now (ESCO altLabel)
#   not_to_be_confused_with  sibling or near nodes a labeller mixes up with this one (scope note)
#   applies_to            which items can carry it: place, trail, beach, lake, mountain
#   source                text: inferred from passages by the tagger; data: set from a data field
#                         by rule, never by the model; both: a data rule where the field exists, text elsewhere
#   deprecated            optional; true keeps the id resolvable for old data

