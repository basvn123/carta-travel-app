# Data quality rules (ROADMAP D2, T1142). Read by scripts/quality/engine.py.
#
# One rule per must-have field of every layer the scorecard measures
# (scripts/quality/scorecard.py APP_LAYERS and SHARD_LAYERS). The engine
# refuses to run when a scorecard field has no rule here, so a new field
# cannot slip past the gate unnoticed.
#
# Each rule reads the field's completeness: the share of records that carry
# a non-empty value (0 to 1).
#
#   level  must_see   a field the traveller sees on a card or page.
#          must_have  a field the app reads but does not show on its own.
#   kind   hard       a breach fails the pipeline run (exit 1).
#          soft       a breach is printed as a warning; the run goes on.
#   min    the floor for the share. Set on 2026-11-06 at two points under
#          the shipped value, rounded down to a whole point; the comment on
#          each line gives the value it was set from.
#
# The gate: a must_see field whose share falls by more than
# gate.must_see_drop_points percentage points against the previous card
# fails the run, whatever its kind and floor.
version: 1
gate:
  must_see_drop_points: 2
  trend_days: 90
rules:
  # core (app_data, 3855 records on 2026-11-06)
  - {id: core.tier, layer: core, field: tier, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.city, layer: core, field: city, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.country, layer: core, field: country, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.iso2, layer: core, field: iso2, level: must_have, kind: soft, min: 0.98}  # 100.0%
  - {id: core.lat, layer: core, field: lat, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.lon, layer: core, field: lon, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.categories, layer: core, field: categories, level: must_see, kind: hard, min: 0.98}  # 100.0%
  - {id: core.tags, layer: core, field: tags, level: must_have, kind: soft, min: 0.00}  # 2.1%
  - {id: core.blurb, layer: core, field: blurb, level: must_see, kind: hard, min: 0.91}  # 93.6%
  # flights (app_data, 3855 records on 2026-11-06)
