name: coverage-parity

# Coverage parity (ROADMAP D6, T1145; workflow T1214 from register row T1145-f).
# scripts/coverage/coverage_parity.py builds docs/data/coverage-parity.md and
# .csv from the shipped wire and two small cache files. --check rebuilds both
# in memory and fails when the committed files differ, so a change to the
# catalogue, the expectation or the script cannot leave the parity table and
# the D15 backlog stale. Standard library only, no network, about 5 seconds.
#
# Fix a failure with `python -I scripts/coverage/coverage_parity.py` and commit
# the two docs/data files with the change that moved them.
on:
  push:
    branches: [main]
    paths:
      - "scripts/coverage/coverage_parity.py"
      - "pipeline/diagnostics/coverage_report.py"
      - "docs/data/coverage-parity.md"
      - "docs/data/coverage-parity.csv"
      - "continent-app/public/app_data.json"
      - "continent-app/public/coverage.json"
      - "continent-app/public/dossier/**"
      - "continent-app/public/app_data/why_i18n/**"
      - "continent-app/public/region/**"
      - "continent-app/public/trails/*.json"
      - "continent-app/public/beaches/*.json"
      - "continent-app/public/lakes/*.json"
      - "continent-app/public/mountains/*.json"
      - "cache/eurostat_nights_nuts3.json"
      - "cache/nuts3_2021.geojson"
      - ".github/workflows/coverage-parity.yml"
  pull_request:
    paths:
      - "scripts/coverage/coverage_parity.py"
      - "pipeline/diagnostics/coverage_report.py"
      - "docs/data/coverage-parity.md"
      - "docs/data/coverage-parity.csv"
      - "continent-app/public/app_data.json"
      - "continent-app/public/coverage.json"
      - "continent-app/public/dossier/**"
      - "continent-app/public/app_data/why_i18n/**"
      - "continent-app/public/region/**"
      - "continent-app/public/trails/*.json"
      - "continent-app/public/beaches/*.json"
      - "continent-app/public/lakes/*.json"
      - "continent-app/public/mountains/*.json"
      - "cache/eurostat_nights_nuts3.json"
      - "cache/nuts3_2021.geojson"
      - ".github/workflows/coverage-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pattern mode: the nature folders hold thousands of detail files each,
      # and the script reads only their country files.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/coverage/
            /pipeline/diagnostics/coverage_report.py
            /docs/data/coverage-parity.md
            /docs/data/coverage-parity.csv
            /cache/eurostat_nights_nuts3.json
            /cache/nuts3_2021.geojson
            /continent-app/public/app_data.json
            /continent-app/public/coverage.json
            /continent-app/public/dossier/
            /continent-app/public/app_data/why_i18n/
            /continent-app/public/region/
            /continent-app/public/trails/[A-Z][A-Z].json
            /continent-app/public/beaches/[A-Z][A-Z].json
            /continent-app/public/lakes/[A-Z][A-Z].json
            /continent-app/public/mountains/[A-Z][A-Z].json
      - name: Pull the two LFS inputs (about 2.6 MB)
        run: git lfs pull --include="cache/eurostat_nights_nuts3.json,cache/nuts3_2021.geojson"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: The committed parity table is what a fresh run writes
        run: python -I scripts/coverage/coverage_parity.py --check
