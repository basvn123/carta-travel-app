name: ci

# H1 (T1057): the checks that run on every push and pull request.
# App: lint, unit tests, fast build. Python: ruff on the error rules the whole
# repo already passes, and pytest minus the quarantined tests in
# tests/quarantine.txt (the list may only shrink; open item T1057-a).
# mypy is not run: the repo has no mypy config yet (ROADMAP A2).
# Actions are pinned to commit SHAs (tag in the comment beside each).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: continent-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: continent-app/package-lock.json
      - run: npm ci
      - name: Lint (errors fail, warnings do not)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Fast build (publicDir off, see scripts/vite.fast.mjs)
        env:
          FAST_OUT: ../.fastbuild
        run: node node_modules/vite/bin/vite.js build --config ../scripts/vite.fast.mjs
      # ROADMAP C4 (T1078): no browser bundle carries a privileged Supabase
      # key. Decodes every JWT-shaped string in the build, because a service
      # role JWT never names its role in clear text.
      - name: No service key in the browser bundle
        run: node scripts/ci/check-bundle-secrets.mjs ../.fastbuild

  # ROADMAP C5 (T1090, row T1079-e): the fast build served under the real CSP
  # from public/_headers, every screen at phone and desktop width plus the
  # print popup and a prerendered page, in Chromium. Fails on any CSP refusal
  # (style-src has no 'unsafe-inline' since T1090) or a screen that never
  # paints. Hermetic: remote requests are stubbed or aborted. About 5 minutes.
  csp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: continent-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: continent-app/package-lock.json
      - run: npm ci
      - name: Chromium for the lockfile's Playwright
        run: npx playwright install --with-deps chromium
      - name: style-src hashes match the two inline stylesheets
        run: node scripts/csp-hashes.mjs --check
      - name: Fast build (publicDir off; the gate serves public/ beside it)
        env:
          FAST_OUT: ../.fastbuild
        run: node node_modules/vite/bin/vite.js build --config ../scripts/vite.fast.mjs
      - name: No CSP violation on any screen
        run: node scripts/verify_csp.mjs --dist ../.fastbuild

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pull the small LFS files the rating tests read (about 4 MB)
        run: git lfs pull --include="cache/unesco_whc.json,cache/urban_fabric.json,cache/dest_pageviews.json,app_data/curated_appeal.json,app_data/curated_why_i18n.json,app_data/rubric_appeal.json"
      - run: pip install -r requirements.txt pytest ruff==0.14.3
      # node for the docs drift check's wire-table half (and its pytest).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format github pipeline src scripts run_pipeline.py tests
      - name: Pytest (quarantined tests deselected)
        run: |
          args=$(grep -v '^#' tests/quarantine.txt | grep . | sed 's/^/--deselect /')
          python -m pytest tests -q -rs $args
      - name: Entry points in CLAUDE.md and MAP.md exist
        run: python -I scripts/docs/check_entry_points.py
      # B7 (T1134): the docs still say what the code does. Constants and tests
      # named in docs/logic/, SCHEMA.md against docs/wire.schema.json, and the
      # entry points again. Known drift is in scripts/docs/drift_baseline.json.
      - name: Docs drift (logic catalogue, wire table, entry points)
        run: python -I scripts/docs/drift.py
      # B4 (T1165): docs/reference/config.md lists every key of continent-app/config/
      # and scripts/quality/rules.yaml. Fails when a key is added or removed without
      # regenerating it (python -I scripts/docs/config_reference.py).
      - name: Config reference lists every config key
        run: python -I scripts/docs/config_reference.py --check
