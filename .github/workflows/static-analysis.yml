name: static-analysis

# Semgrep with Carta's own rules (.semgrep/carta.yml) and a committed baseline
# (.semgrep/baseline.json). Findings already triaged do not block; a new
# finding fails the PR. See docs/security/static-analysis.md (T1119, C7).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep (pinned)
        run: pip install semgrep==1.184.0 pytest
      - name: Self-test the gate
        run: python -m pytest tests/test_semgrep_gate.py -q
      - name: Scan and compare with the baseline
        run: python scripts/ci/semgrep_gate.py
