name: secret-scan

# Fails the build if a privileged Supabase key (or any service_role JWT claim)
# ever reaches source control or the compiled client bundle. The anon /
# publishable key is meant to be public and is intentionally NOT flagged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # High-signal patterns for every credential family this repo handles:
      # Supabase secret keys, service_role JWTs (the two-segment eyJ…eyJ shape,
      # so plain `grant … to service_role` SQL no longer trips it), GitHub PATs,
      # Google AI keys, Anthropic keys, Kaggle tokens, Stripe live/webhook
      # secrets, AWS access keys and PEM private keys. The Supabase anon /
      # publishable key is meant to be public and is intentionally NOT flagged.
      # supabase/migrations + config.toml legitimately name the service_role
      # Postgres ROLE, so the bare word is only flagged outside those paths.
      - name: Scan source tree for privileged secrets
        run: |
          PATTERNS='sb_secret_[A-Za-z0-9]|github_pat_[0-9A-Za-z_]{20}|ghp_[0-9A-Za-z]{30}|AIza[0-9A-Za-z_-]{30}|sk-ant-|sk_live_|whsec_|KGAT_[0-9A-Za-z]{16}|AKIA[0-9A-Z]{16}|eyJ[A-Za-z0-9_-]{10,}\.eyJ|BEGIN (RSA |EC )?PRIVATE KEY'
          if git grep -nE "$PATTERNS" -- ':!.github/workflows/secret-scan.yml' ':!continent-app/package-lock.json'; then
            echo "::error::Privileged secret found in source. Never commit a real API key, token or private key."
            exit 1
          fi
          if git grep -nE 'service_role' -- ':!.github/workflows/secret-scan.yml' ':!supabase/migrations' ':!supabase/config.toml'; then
            echo "::error::service_role reference outside supabase SQL. A privileged key must never reach the client."
            exit 1
          fi
          echo "Source tree clean."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: continent-app/package-lock.json

      - name: Install dependencies
        working-directory: continent-app
        run: npm ci

      # Catches undefined references (a plain build shipped a ReferenceError
      # crash), rules-of-hooks violations and dead bindings before they merge.
      # Warnings (the exhaustive-deps backlog) don't fail; only errors do.
      - name: Lint
        working-directory: continent-app
        run: npm run lint

      - name: Build client bundle
        working-directory: continent-app
        run: npm run build

      # The bundle is what actually ships to users' browsers. If a secret got
      # inlined via a VITE_-prefixed env var, it shows up here.
      - name: Scan compiled bundle for privileged secrets
        working-directory: continent-app
        run: |
          if grep -rE 'sb_secret_|service_role' dist; then
            echo "::error::Privileged Supabase secret found in the built bundle."
            exit 1
          fi
          echo "Bundle clean."
