name: secret-scan

# Fails the build if a privileged Supabase key (or any service_role JWT claim)
# ever reaches source control or the compiled client bundle. The anon /
# publishable key is meant to be public and is intentionally NOT flagged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # High-signal patterns: the new secret-key prefix and the service_role
      # claim that every privileged Supabase JWT carries. Neither should ever
      # appear in a client-side app.
      - name: Scan source tree for privileged secrets
        run: |
          if git grep -nE 'sb_secret_|service_role' -- ':!.github/workflows/secret-scan.yml'; then
            echo "::error::Privileged Supabase secret found in source. Never commit a service_role / sb_secret_ key."
            exit 1
          fi
          echo "Source tree clean."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: continent-app/package-lock.json

      - name: Install dependencies
        working-directory: continent-app
        run: npm ci

      # Catches undefined references (a plain build shipped a ReferenceError
      # crash), rules-of-hooks violations and dead bindings before they merge.
      # Warnings (the exhaustive-deps backlog) don't fail; only errors do.
      - name: Lint
        working-directory: continent-app
        run: npm run lint

      - name: Build client bundle
        working-directory: continent-app
        run: npm run build

      # The bundle is what actually ships to users' browsers. If a secret got
      # inlined via a VITE_-prefixed env var, it shows up here.
      - name: Scan compiled bundle for privileged secrets
        working-directory: continent-app
        run: |
          if grep -rE 'sb_secret_|service_role' dist; then
            echo "::error::Privileged Supabase secret found in the built bundle."
            exit 1
          fi
          echo "Bundle clean."
