name: zap

# ROADMAP C10 (T1164): OWASP ZAP baseline scan, failing on any High alert.
#
# Two jobs:
#   local    the fast build served by `wrangler pages dev` with the real
#            public/_headers, _redirects, _routes.json and Pages Functions, on
#            localhost inside the runner. Runs on a pull request that touches
#            the headers, the functions, the index page or these files, and on
#            demand. It catches a header regression before it ships.
#   preview  the deployed preview (or any URL given), on demand. Run it after
#            each preview deploy (owner step T1164-a; the deploy is manual).
#
# The baseline scan is passive: it spiders the target for about a minute and
# reads the responses. It sends no attack payloads, so it is safe against the
# preview, but point it only at Carta's own hosts.
#
# The gate is by risk, not by ZAP's exit code: zap-baseline.py rule levels are
# per plugin, so the job reads the JSON report and fails when any alert has
# riskcode 3 (High). Mediums and Lows are listed in the job summary and the
# report artifact, and each one is a register row in docs/owner/.
# Exit code 3 (ZAP itself failed) and 1 (a rule marked FAIL in
# .zap/rules.tsv) also fail the job.
#
# The image is pinned by digest: zaproxy/zap-stable 2.17.0, the image the
# T1164 local run used. Bump it on purpose, with a rerun recorded.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL to scan (default: the preview branch deploy)"
        required: false
        default: "https://preview.carta-app.pages.dev"
      job:
        description: "Which scan: preview (the URL above) or local (the fast build)"
        required: false
        default: "preview"
        type: choice
        options: [preview, local]
  pull_request:
    paths:
      - "continent-app/public/_headers"
      - "continent-app/public/_redirects"
      - "continent-app/public/_routes.json"
      - "continent-app/functions/**"
      - "continent-app/index.html"
      - "continent-app/wrangler.toml"
      - ".zap/rules.tsv"
      - ".github/workflows/zap.yml"

permissions:
  contents: read

env:
  ZAP_IMAGE: zaproxy/zap-stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
  WRANGLER: wrangler@4.158.0

jobs:
  local:
    if: github.event_name == 'pull_request' || inputs.job == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: continent-app/package-lock.json
      - name: Fast build with the Pages routing files
        working-directory: continent-app
        env:
          FAST_OUT: ../.fastbuild
        run: |
          npm ci
          node node_modules/vite/bin/vite.js build --config ../scripts/vite.fast.mjs
          cp public/_headers public/_redirects public/_routes.json ../.fastbuild/
          # the deploy's 404.html (scripts/build-pages.mjs, T294-a), so an unknown path
          # answers 404 here as it does live (T1164-e, T1211)
          cp ../.fastbuild/index.html ../.fastbuild/404.html
      # wrangler.toml minus the Workers AI binding, which `pages dev` can only
      # run remotely (it needs a Cloudflare token the scan must not have). The
      # Ask answer route then refuses with no_ai, which is fine for a header scan.
      - name: Serve the build like Pages (local preview)
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          python3 - "$RUNNER_TEMP/preview/wrangler.toml" <<'PY'
          import re, sys
          s = open('continent-app/wrangler.toml').read()
          s = re.sub(r'(?ms)^\[ai\].*?(?=^\[|\Z)', '', s)
          s = s.replace('pages_build_output_dir = "dist"', 'pages_build_output_dir = "%s/.fastbuild"' % __import__('os').getcwd())
          open(sys.argv[1], 'w').write(s)
          PY
          ln -s "$PWD/continent-app/functions" "$RUNNER_TEMP/preview/functions"
          cd "$RUNNER_TEMP/preview"
          nohup npx --yes "$WRANGLER" pages dev --port 8788 --ip 0.0.0.0 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8788/ && break
            sleep 2
          done
          curl -fsSI http://127.0.0.1:8788/ || { cat "$RUNNER_TEMP/wrangler.log"; exit 1; }
      - name: ZAP baseline
        run: |
          mkdir -p zap && chmod 777 zap
          cp .zap/rules.tsv zap/rules.tsv
          rc=0
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:8788/ -c rules.tsv -I -j \
            -J zap.json -r zap.html -w zap.md || rc=$?
          echo "zap exit code $rc"
          echo "ZAP_RC=$rc" >> "$GITHUB_ENV"
      - name: Gate (fail on any High)
        run: |
          python3 - zap/zap.json <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          rows = [(int(a['riskcode']), a['pluginid'], a['name'], int(a['count']))
                  for s in d.get('site', []) for a in s.get('alerts', [])]
          rows.sort(reverse=True)
          names = {3: 'High', 2: 'Medium', 1: 'Low', 0: 'Info'}
          lines = ['| Risk | Plugin | Alert | Count |', '|---|---|---|---|']
          lines += [f'| {names[r]} | {p} | {n} | {c} |' for r, p, n, c in rows]
          counts = {names[k]: sum(1 for r in rows if r[0] == k) for k in names}
          summary = f"ZAP {d.get('@version')}: " + ', '.join(f'{v} {k}' for k, v in counts.items())
          print(summary); print('\n'.join(lines))
          with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as f:
              f.write(f'### {summary}\n\n' + '\n'.join(lines) + '\n')
          rc = int(os.environ.get('ZAP_RC', '0'))
          if rc in (1, 3):
              sys.exit(f'zap-baseline exit code {rc} (1: a FAIL rule, 3: ZAP error)')
          if counts['High']:
              sys.exit(f"{counts['High']} High alert(s): fix them, or document a false positive in .zap/rules.tsv with a register row")
          PY
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-local
          path: zap/
          retention-days: 30

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Only Carta's own hosts
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 - "$TARGET" <<'PY'
          import sys, urllib.parse
          u = urllib.parse.urlparse(sys.argv[1])
          ok = u.scheme == 'https' and (u.hostname == 'carta-app.pages.dev' or (u.hostname or '').endswith('.carta-app.pages.dev')
                                        or u.hostname in ('carta-europetravel.com', 'www.carta-europetravel.com'))
          sys.exit(0 if ok else f'refusing to scan {sys.argv[1]}: not a Carta host')
          PY
      - name: ZAP baseline
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p zap && chmod 777 zap
          cp .zap/rules.tsv zap/rules.tsv
          rc=0
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -c rules.tsv -I -j \
            -J zap.json -r zap.html -w zap.md || rc=$?
          echo "zap exit code $rc"
          echo "ZAP_RC=$rc" >> "$GITHUB_ENV"
      - name: Gate (fail on any High)
        run: |
          python3 - zap/zap.json <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          rows = [(int(a['riskcode']), a['pluginid'], a['name'], int(a['count']))
                  for s in d.get('site', []) for a in s.get('alerts', [])]
          rows.sort(reverse=True)
          names = {3: 'High', 2: 'Medium', 1: 'Low', 0: 'Info'}
          lines = ['| Risk | Plugin | Alert | Count |', '|---|---|---|---|']
          lines += [f'| {names[r]} | {p} | {n} | {c} |' for r, p, n, c in rows]
          counts = {names[k]: sum(1 for r in rows if r[0] == k) for k in names}
          summary = f"ZAP {d.get('@version')}: " + ', '.join(f'{v} {k}' for k, v in counts.items())
          print(summary); print('\n'.join(lines))
          with open(os.environ.get('GITHUB_STEP_SUMMARY', os.devnull), 'a') as f:
              f.write(f'### {summary}\n\n' + '\n'.join(lines) + '\n')
          rc = int(os.environ.get('ZAP_RC', '0'))
          if rc in (1, 3):
              sys.exit(f'zap-baseline exit code {rc} (1: a FAIL rule, 3: ZAP error)')
          if counts['High']:
              sys.exit(f"{counts['High']} High alert(s): fix them, or document a false positive in .zap/rules.tsv with a register row")
          PY
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-preview
          path: zap/
          retention-days: 30
