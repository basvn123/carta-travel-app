name: supply-chain

# C6 (T1080): dependency audits and SBOMs.
# - npm audit on the shipped dependencies fails on a critical advisory.
# - pip-audit has no severity filter; any advisory in constraints.txt fails (T1088).
# - OSV-Scanner reads both lockfiles and every requirements file.
# - SBOMs (CycloneDX) are built on tags, releases and manual runs only.
# Actions are pinned to commit SHAs (tag in the comment beside each).
# Baseline on 2026-11-05 is in T1080.

on:
  pull_request:
    paths:
      - "continent-app/package.json"
      - "continent-app/package-lock.json"
      - "tools/trailslab/review/package.json"
      - "tools/trailslab/review/package-lock.json"
      - "requirements*.txt"
      - "constraints.txt"
      - "infra/hetzner/jobs/requirements*.txt"
      - "services/intelligence/requirements*.txt"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "17 5 * * 1"
  push:
    tags:
      - "v*"
      - "prod-*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm audit, shipped dependencies, fail on critical
        working-directory: continent-app
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit, whole tree incl. dev, fail on high (clean since T1088)
        working-directory: continent-app
        run: npm audit --audit-level=high
      - name: npm audit, trailslab review tool, fail on high (never shipped)
        working-directory: tools/trailslab/review
        run: npm audit --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.10.1
      # requirements.txt holds floors (">="), which pip-audit cannot audit, so
      # the audit reads constraints.txt, the exact pins the pipeline runs.
      # pip-audit has no severity filter, so any advisory fails the build.
      # T1088 bumped the 12 flagged pins, so this is clean (0 advisories on
      # 2026-11-05) and now a gate.
      - name: pip-audit constraints.txt (gate)
        run: pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off
      # The Intelligence API's own pins (T1215, register row T1154-e): every
      # line is exact, so this is a gate like constraints.txt.
      - name: pip-audit services/intelligence/requirements.txt (gate)
        run: pip-audit -r services/intelligence/requirements.txt --no-deps --disable-pip --progress-spinner off
      # requirements-ml.txt ends in a range ("huggingface-hub>=0.34,<1.0"),
      # which pip-audit refuses, so it cannot be a gate yet (T1088-e).
      - name: pip-audit requirements-ml.txt (report only)
        continue-on-error: true
        run: pip-audit -r requirements-ml.txt --no-deps --disable-pip --progress-spinner off || true

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      # Scans the two lockfiles and the pinned Python file. It fails on any
      # known advisory; the baseline was cleared in T1088, so it is a gate.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=continent-app/package-lock.json
            --lockfile=tools/trailslab/review/package-lock.json
            --lockfile=requirements.txt:constraints.txt

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build the CycloneDX SBOMs
        run: bash scripts/ci/sbom.sh sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
