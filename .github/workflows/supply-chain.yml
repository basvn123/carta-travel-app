name: supply-chain

# C6 (T1080): dependency audits and SBOMs.
# - npm audit on the shipped dependencies fails on a critical advisory.
# - pip-audit has no severity filter, so it reports and never fails (the reason
#   is on the step); the same findings reach a pull request through OSV.
# - OSV-Scanner reads both lockfiles and every requirements file.
# - SBOMs (CycloneDX) are built on tags, releases and manual runs only.
# Actions are pinned to commit SHAs (tag in the comment beside each).
# Baseline on 2026-11-05 is in Execution/P15/T1080-supply-chain.md.

on:
  pull_request:
    paths:
      - "continent-app/package.json"
      - "continent-app/package-lock.json"
      - "tools/trailslab/review/package.json"
      - "tools/trailslab/review/package-lock.json"
      - "requirements*.txt"
      - "constraints.txt"
      - "infra/hetzner/jobs/requirements*.txt"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "17 5 * * 1"
  push:
    tags:
      - "v*"
      - "prod-*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm audit, shipped dependencies, fail on critical
        working-directory: continent-app
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit, whole tree, report only
        working-directory: continent-app
        continue-on-error: true
        run: npm audit --audit-level=none || true
      - name: npm audit, trailslab review tool, report only (never shipped)
        working-directory: tools/trailslab/review
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=none || true

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.10.1
      # requirements.txt holds floors (">="), which pip-audit cannot audit, so
      # the audit reads constraints.txt, the exact pins the pipeline runs.
      # pip-audit 2.x has no severity filter (it prints an advisory ID and fix
      # versions only), so this step reports and does not fail. A gate that
      # failed on any advisory would be red from day one (12 packages on
      # 2026-11-05). Move to a gate when the constraints are bumped (T1080-b).
      - name: pip-audit constraints.txt (report only)
        continue-on-error: true
        run: pip-audit -r constraints.txt --no-deps --disable-pip --progress-spinner off || true
      - name: pip-audit requirements-ml.txt (report only)
        continue-on-error: true
        run: pip-audit -r requirements-ml.txt --no-deps --disable-pip --progress-spinner off || true

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'push' && github.event_name != 'release'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      # Scans the two lockfiles and the pinned Python file. It fails on any
      # known advisory, so it is report-only until the baseline is cleared
      # (T1080-b); the log lists every finding.
      - name: OSV-Scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=continent-app/package-lock.json
            --lockfile=tools/trailslab/review/package-lock.json
            --lockfile=requirements.txt:constraints.txt

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build the CycloneDX SBOMs
        run: bash scripts/ci/sbom.sh sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
