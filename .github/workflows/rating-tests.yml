name: rating-tests

# The rating model's regression harness (PLAN.md E1 + E2): the 120-pair
# golden order set and the distribution contract. Runs on every change to
# the pipeline, the tests themselves, or the shipped wire, so a scoring
# regression fails the build instead of reaching the catalogue. The tests
# read the tracked wire (continent-app/public/app_data.json) in CI; the
# gitignored master is only used locally.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "continent-app/public/app_data.json"
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "continent-app/public/app_data.json"

permissions:
  contents: read

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Golden pairs and distribution contract
        run: pytest tests/test_golden_ratings.py tests/test_rating_distribution.py -q -rs
      - name: Coverage ratchet (register coverage may only rise)
        run: python pipeline/diagnostics/coverage_report.py --check
