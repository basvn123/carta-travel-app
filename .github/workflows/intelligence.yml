name: intelligence

# ROADMAP F5 (T1154): the Carta Intelligence API in services/intelligence/.
# pytest runs every endpoint against its eval set as a contract test (the
# taxonomy eval through continent-app/scripts/eval/run.mjs, the linking eval's
# 300 mentions, evals/profile.json, the similar check on the seed labels),
# plus auth, rate limit, logs, metrics and the bridge. It also checks that
# openapi.json and docs/reference/openapi.md are current. No key, no network
# beyond pip. The engines it calls live elsewhere, so their paths run it too.
on:
  push:
    paths:
      - "services/intelligence/**"
      - "pipeline/taxonomy/**"
      - "pipeline/prompt_registry.py"
      - "continent-app/src/lib/linking/**"
      - "continent-app/src/lib/taste/**"
      - "continent-app/scripts/eval/**"
      - "scripts/docs/build_reference.py"
      - ".github/workflows/intelligence.yml"
  pull_request:
    paths:
      - "services/intelligence/**"
      - "pipeline/taxonomy/**"
      - "pipeline/prompt_registry.py"
      - "continent-app/src/lib/linking/**"
      - "continent-app/src/lib/taste/**"
      - "continent-app/scripts/eval/**"
      - "scripts/docs/build_reference.py"
      - ".github/workflows/intelligence.yml"

permissions:
  contents: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r services/intelligence/requirements-dev.txt
      - name: Lint
        run: ruff check services/intelligence
      - name: OpenAPI current
        working-directory: services/intelligence
        run: python -m intelligence.openapi_dump --check
      - name: Reference current
        run: python -I scripts/docs/build_reference.py --check
      - name: Tests (eval sets as contract tests)
        run: python -m pytest services/intelligence/tests -q -rs
