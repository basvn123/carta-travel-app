name: mcp

# ROADMAP F7 (T1155): the Carta MCP server in services/mcp/. Tests run on the
# fixture wire data in services/mcp/tests/fixtures, with the official MCP
# client talking to the server in memory and over stdio. No key, no network
# beyond npm. It also reads the app's price engine and aiGuard, so changes to
# those paths run it too.
on:
  push:
    paths:
      - "services/mcp/**"
      - "continent-app/src/lib/price/**"
      - "continent-app/functions/_lib/aiGuard.js"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "services/mcp/**"
      - "continent-app/src/lib/price/**"
      - "continent-app/functions/_lib/aiGuard.js"
      - ".github/workflows/mcp.yml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the app (the price engine imports its modules)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: continent-app
      - name: Install the server
        run: npm ci --no-audit --no-fund
        working-directory: services/mcp
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: services/mcp
      - name: Tests
        run: npm test
        working-directory: services/mcp
