name: linking-eval

# ROADMAP F4 (T1153, wired by T1215 for register row T1153-f): the place
# linking eval gate. 300 messy place mentions
# (continent-app/scripts/eval/linking/set.json) go through the shared place
# linker (continent-app/src/lib/linking/) on the shipped catalogue; the job
# fails when its MRR or accuracy@1 falls more than 2 points (TOLERANCE in
# scripts/eval/linking/eval.mjs) under the blessed baseline
# (scripts/eval/linking/baseline.json), or below today's Explore search.
#
# No secret, no model, no network beyond the checkout and npm: the linker
# reads public/app_data.json, public/search_index.json and
# public/search/ask/lexicon.json. The eval itself needs no npm package; the
# unit tests do (the Destinations hook imports React).
#
# A change that moves the score on purpose re-blesses in the same change:
#   cd continent-app && node scripts/eval/linking/eval.mjs --bless
# The self-test step runs the linker without its exonym and endonym sources
# (--seed-drop) and must fail; if it passes, the gate is broken.
on:
  push:
    paths:
      - "continent-app/src/lib/linking/**"
      - "continent-app/src/lib/searchIndex.js"
      - "continent-app/scripts/eval/linking/**"
      - "continent-app/scripts/eval/adapters/linking.mjs"
      - "continent-app/scripts/eval/run.mjs"
      - "continent-app/scripts/eval/lib/**"
      - "continent-app/tests/placeLinking.test.mjs"
      - ".github/workflows/linking-eval.yml"
  pull_request:
    paths:
      - "continent-app/src/lib/linking/**"
      - "continent-app/src/lib/searchIndex.js"
      - "continent-app/scripts/eval/linking/**"
      - "continent-app/scripts/eval/adapters/linking.mjs"
      - "continent-app/scripts/eval/run.mjs"
      - "continent-app/scripts/eval/lib/**"
      - "continent-app/tests/placeLinking.test.mjs"
      - ".github/workflows/linking-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linking-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: continent-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          # Cone mode also brings the files directly in continent-app/ and
          # continent-app/public/ (app_data.json, search_index.json);
          # public/search holds ask/lexicon.json.
          sparse-checkout: |
            continent-app/src
            continent-app/config
            continent-app/scripts/eval
            continent-app/tests
            continent-app/public/search
            supabase/functions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: continent-app/package-lock.json
      - name: Self-test (a seeded drop must fail the gate)
        env:
          CARTA_EVAL_OUT: ${{ runner.temp }}/linking-eval
        run: |
          set +e
          node scripts/eval/run.mjs linking --seed-drop --check | tee "$RUNNER_TEMP/seeded.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != "1" ]; then
            echo "::error::the seeded drop did not fail the linking gate (exit $code)"
            exit 1
          fi
      - name: Score and gate
        env:
          CARTA_EVAL_OUT: ${{ runner.temp }}/linking-eval
        run: node scripts/eval/run.mjs linking --check --write
      - run: npm ci
      - name: Unit tests (linker, search adapter, Ask and parse-booking hooks)
        run: node --test tests/placeLinking.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linking-eval
          path: ${{ runner.temp }}/linking-eval/
