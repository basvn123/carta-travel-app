name: ai-guard

# ROADMAP E3 and C8 (T1117, T1137): the injection set and the model gateway.
#
# evals/injection/attacks.json holds the prompt-injection and output-handling
# attacks against every AI surface: Ask, plan-day, suggest-city,
# parse-booking and the pipeline's batch jobs. Each attack carries a
# recorded worst-case model output, so this job needs no key, no model and
# no network beyond the checkout, npm and pip. It runs:
#   - continent-app/tests/aiGuard.test.mjs    the guard on Ask, plan-day, parse-booking
#   - continent-app/tests/aiGateway.test.mjs  aiModels (config, failure rules), suggest-city
#                                             attacks, the grep for direct provider calls,
#                                             and the Python scanner's parity with aiGuard
#   - tests/test_ai_gateway.py                pipeline/ai_gateway.py and the pipeline attacks
#
# The same node tests also run in ci.yml's `npm test` on every push, so a
# direct provider call added anywhere fails CI even where this job's paths
# do not match. This job is the one to read when an attack starts passing.
on:
  push:
    paths:
      - "supabase/functions/**"
      - "continent-app/functions/**"
      - "continent-app/src/lib/ask/**"
      - "pipeline/ai_gateway.py"
      - "pipeline/dossier/rewrite_intros.py"
      - "pipeline/dossier/parking_check.py"
      - "pipeline/ask_lexicon.py"
      - "Trips/carta-unified/carta-unified/pipeline/generate_trip.py"
      - "evals/injection/**"
      - "continent-app/tests/aiGuard.test.mjs"
      - "continent-app/tests/aiGateway.test.mjs"
      - "tests/test_ai_gateway.py"
      - ".github/workflows/ai-guard.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "continent-app/functions/**"
      - "continent-app/src/lib/ask/**"
      - "pipeline/ai_gateway.py"
      - "pipeline/dossier/rewrite_intros.py"
      - "pipeline/dossier/parking_check.py"
      - "pipeline/ask_lexicon.py"
      - "Trips/carta-unified/carta-unified/pipeline/generate_trip.py"
      - "evals/injection/**"
      - "continent-app/tests/aiGuard.test.mjs"
      - "continent-app/tests/aiGateway.test.mjs"
      - "tests/test_ai_gateway.py"
      - ".github/workflows/ai-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  injection-set:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: continent-app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: npm ci
        working-directory: continent-app
        run: npm ci
      - name: Injection set, guard and gateway (node)
        working-directory: continent-app
        run: node --test --test-concurrency=1 tests/aiGuard.test.mjs tests/aiGateway.test.mjs
      - name: Pipeline gateway and the pipeline attacks (python)
        run: python -m pytest tests/test_ai_gateway.py -q
