name: docs-site

# ROADMAP B6 (T1167). Regenerates docs/reference/, then builds the MkDocs
# Material site with full-text search. The private deploy to the Cloudflare
# Pages project carta-docs is an owner step (Execution/P15/T1167-docs-site.md);
# this job builds and uploads the site as an artifact, it never deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - "run_pipeline.py"
      - "pipeline/tasks/**"
      - "pipeline/**"
      - "supabase/migrations/**"
      - "continent-app/src/lib/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - "supabase/migrations/**"
      - ".github/workflows/docs-site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt pyyaml
      # Task catalogue and Supabase schema must be committed fresh.
      - name: Reference check
        run: python -I scripts/docs/build_reference.py --check
      # The API files move with every code edit: build from a fresh generation.
      - name: Regenerate reference
        run: python -I scripts/docs/build_reference.py
      # Ask the docs (T1168): the passages index (git-ignored) and the core
      # copy the site loads, both written by the builder (T1206, row T1168-e).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Ask the docs index and core
        run: node scripts/docs/ask_docs.mjs build
      - name: Ask the docs files exist
        run: test -s docs/assets/ask-docs/index.js && cmp scripts/docs/ask_docs_core.js docs/assets/ask-docs/core.js
      - name: Build site
        run: NO_MKDOCS_2_WARNING=1 mkdocs build -d .docs-site
      - name: Search index exists
        run: test -s .docs-site/search/search_index.json
      - uses: actions/upload-artifact@v4
        with:
          name: carta-docs-site
          path: .docs-site
          retention-days: 7
