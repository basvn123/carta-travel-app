name: entry-points

# Every Claude session starts at CLAUDE.md and docs/project-map.md and
# follows their pointers. This job fails when one names a path that does not
# exist (ROADMAP A4).

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "docs/project-map.md"
      - "docs/lessons.md"
      - "scripts/docs/check_entry_points.py"
      - ".github/workflows/entry-points.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - "docs/project-map.md"
      - "docs/lessons.md"
      - "scripts/docs/check_entry_points.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Entry points name only existing paths
        run: python -I scripts/docs/check_entry_points.py
