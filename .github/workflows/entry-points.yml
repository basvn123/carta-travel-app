name: entry-points

# Every Claude session starts at CLAUDE.md and MAP.md and follows their
# pointers. This job fails when either names a path that does not exist
# (ROADMAP A4, T1051).

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "MAP.md"
      - "scripts/docs/check_entry_points.py"
      - ".github/workflows/entry-points.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - "MAP.md"
      - "scripts/docs/check_entry_points.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Entry points name only existing paths
        run: python -I scripts/docs/check_entry_points.py
