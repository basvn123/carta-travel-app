name: uptime

# T235. Probes the app, the data host, the Supabase project, the published row
# counts and the pipeline_runs table every 15 minutes with scripts/monitor/check.py.
# A failing check turns this run red, and GitHub emails the repository owner for a
# failed scheduled run, so the alert works with no secret set. Add the optional
# secrets below for a push alert and for the pipeline checks:
#   ALERT_WEBHOOK_URL            Slack-style incoming hook, or an ntfy topic URL
#   SUPABASE_ANON_KEY            the public anon key, makes the Supabase probe expect 200
#   CARTA_SUPABASE_URL           project REST base, for the pipeline_runs check
#   CARTA_SUPABASE_SERVICE_KEY   service role key, read-only use here, never printed
# GitHub pauses scheduled workflows after 60 days without repository activity;
# a push or a manual run (workflow_dispatch) restarts the schedule.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the monitor
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CARTA_SUPABASE_URL: ${{ secrets.CARTA_SUPABASE_URL }}
          CARTA_SUPABASE_SERVICE_KEY: ${{ secrets.CARTA_SUPABASE_SERVICE_KEY }}
        run: python3 scripts/monitor/check.py --json
