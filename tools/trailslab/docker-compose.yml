# Trails and daytrips content lab: local PostGIS + pgRouting staging DB.
# Local-only by design. This stack never touches the live Supabase project;
# publishing to production is a separate, explicit export step.
#
# Image tag scheme is <postgres>-<postgis>-<pgrouting>. Any recent combination
# works; bump deliberately and re-run the smoke test after changing it.
#
# Usage, from this directory:
#   docker compose up -d
#   python ../../pipeline/trails/smoke_test.py   (from the repo root: python pipeline/trails/smoke_test.py)

services:
  trailslab-db:
    # T324 (T300-f, from T006): multi-arch, so the lab can run on the ARM boxes.
    # pgrouting/pgrouting:17-3.5-3.7 is linux/amd64 only. This is the
    # imresamu bundle0 image (PostgreSQL 17, PostGIS 3.5, pgRouting), amd64 and
    # arm64, pinned by the digest of the multi-arch index (read from the
    # registry 2026-10-03, equal to the one T006 recorded).
    # The laptop keeps its old image until the owner decides: an existing
    # volume has the pgRouting extension at the old version, and the new image
    # may ship a newer one, so after a swap run once, in the lab database:
    #   ALTER EXTENSION pgrouting UPDATE;
    # To stay on the old image: TRAILSLAB_IMAGE=pgrouting/pgrouting:17-3.5-3.7
    # in the repo-root .env (compose reads it) or in the shell.
    image: ${TRAILSLAB_IMAGE:-imresamu/postgis:17-3.5-bundle0-bookworm@sha256:a8ea1a9b5aacd6d9c80d4655d8fbfe3874f33d52b2d8e3b5d6fef5ccb44bd1b1}
    container_name: trailslab-db
    # 5433 on the host: the machine already runs a native PostgreSQL on 5432.
    # Loopback-only: the dev password is a known literal, so the port must
    # never be reachable from the LAN. Re-apply with: docker compose up -d
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: trailslab
      POSTGRES_USER: trailslab
      # Local development password, matches pipeline/trails/db.py defaults.
      # Override via TRAILSLAB_PASSWORD in the repo-root .env if you change it.
      POSTGRES_PASSWORD: trailslab
    volumes:
      # Everything in initdb/ runs once, on first start with an empty volume.
      # To re-apply after schema edits: docker compose down -v && docker compose up -d
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - trailslab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailslab -d trailslab"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  trailslab_pgdata:
